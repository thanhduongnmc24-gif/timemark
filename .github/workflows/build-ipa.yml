name: Tao IPA va Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tao-ipa-va-release:
    name: tao-ipa-va-release
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Chuan hoa icon ung dung
        run: |
          echo "Kiem tra bo icon ung dung va tai nguyen..."
          ls -la TimeStampCamPro/Resources/Assets.xcassets/AppIcon.appiconset/
          ls -la TimeStampCamPro/Resources/Assets.xcassets/HoaPhatLogo.imageset/

      - name: Tao Xcode project
        run: |
          xcodegen generate
          if [ -f "TimeStampCamPro.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' TimeStampCamPro.xcodeproj/project.pbxproj || true
            sed -i '' 's/preferredProjectObjectVersion = 77;/preferredProjectObjectVersion = 56;/g' TimeStampCamPro.xcodeproj/project.pbxproj || true
          fi

      - name: Build ung dung
        run: |
          xcodebuild clean build \
            -project TimeStampCamPro.xcodeproj \
            -scheme TimeStampCamPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Dong goi IPA
        run: |
          rm -rf Payload TimeStampCamPro.ipa
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/TimeStampCamPro.app" Payload/
          zip -r9 TimeStampCamPro.ipa Payload
          rm -rf Payload
          ls -lh TimeStampCamPro.ipa

      - name: Tao thong tin phien ban
        id: version_info
        run: |
          echo "TAG_NAME=v1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=TimeStampCam Pro v1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Luu IPA vao Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeStampCamPro-IPA
          path: TimeStampCamPro.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Tao Release va tai IPA len
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.TAG_NAME }}
          name: ${{ steps.version_info.outputs.RELEASE_TITLE }}
          body: |
            ### TimeStampCam Pro - Ban Build Tu Dong #${{ github.run_number }}
            - **File cai dat:** `TimeStampCamPro.ipa` (Cai qua TrollStore, ESign, Feather, Sideloadly, AltStore)
            - **Tinh nang:** Chup anh luu thang vao Thu vien khong can hoi lai, nut "Anh da chup" tren thanh dau ung dung cho phep chon nhieu anh va chia se nhanh qua Zalo / Facebook, dong dau thoi gian, ngay thang, thu, khung ghi chu To van hanh / Kip truc va logo Hoa Phat Gang Thep.
          files: TimeStampCamPro.ipa
          draft: false
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
