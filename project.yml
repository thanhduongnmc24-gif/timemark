name: TimeStampCamPro
options:
  bundleIdPrefix: com.timestampcam
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  objectVersion: 56
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"

targets:
  TimeStampCamPro:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: TimeStampCamPro
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timestampcam.pro
        INFOPLIST_FILE: TimeStampCamPro/Info.plist
        CODE_SIGN_ENTITLEMENTS: TimeStampCamPro/TimeStampCamPro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: CoreLocation.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
